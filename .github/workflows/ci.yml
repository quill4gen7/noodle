name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          version: latest

  test:
    name: Tests (pure Python, no build123d)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test deps
        run: pip install pytest numpy scipy
      - name: Run tests
        run: python -m pytest tests/ -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Editor session regressions (fake timers, no browser)
        run: node --test tests/ui/*.cjs

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t noodle:ci .
      - name: Browser + CAD smoke (disposable container and projects)
        run: |
          docker run -d --name noodle-smoke noodle:ci
          for i in $(seq 1 30); do
            docker exec noodle-smoke python -c "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')" && break
            sleep 1
          done
          docker exec -i noodle-smoke python - < tests/ui/smoke.py
      - name: Smoke logs
        if: failure()
        run: docker logs noodle-smoke || true
      - name: Clean smoke container
        if: always()
        run: docker rm -f noodle-smoke || true
